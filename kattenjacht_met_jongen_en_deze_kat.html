<div id="message">
  <div class="card">
    🎉<br><b>Je hebt de kat gepakt!</b>
    <p>Score: <span id="final">0</span></p>
    <button id="again">Opnieuw spelen</button>
  </div>
</div>
</div>

<div id="controls">
 <div class="ctrl blank"></div><div class="ctrl" data-key="up">⬆️</div><div class="ctrl blank"></div>
 <div class="ctrl" data-key="left">⬅️</div><div class="ctrl" data-key="down">⬇️</div><div class="ctrl" data-key="right">➡️</div>
</div>
<small>Gebruik pijltjes, WASD of de knoppen.</small>

<script>
(function(){
const game=document.getElementById("game");
const boy=document.getElementById("boy");
const cat=document.getElementById("cat");
const scoreEl=document.getElementById("score");
const message=document.getElementById("message");
const finalEl=document.getElementById("final");

let bx=20,by=290,cx=500,cy=100,score=0,running=true;
const keys={up:false,down:false,left:false,right:false};

function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function reset(){
  const gw=game.clientWidth,gh=game.clientHeight;
  bx=20; by=gh-100;
  cx=gw-110; cy=100;
  score=0; scoreEl.textContent="0";
  running=true; message.style.display="none";
  draw();
}

function draw(){
  boy.style.left=bx+"px"; boy.style.top=by+"px";
  cat.style.left=cx+"px"; cat.style.top=cy+"px";
}

function setKey(k,v){keys[k]=v;}

function keyDown(e){
  const k=e.key.toLowerCase();
  if(k==="arrowup"||k==="w")setKey("up",true);
  if(k==="arrowdown"||k==="s")setKey("down",true);
  if(k==="arrowleft"||k==="a")setKey("left",true);
  if(k==="arrowright"||k==="d")setKey("right",true);
}
function keyUp(e){
  const k=e.key.toLowerCase();
  if(k==="arrowup"||k==="w")setKey("up",false);
  if(k==="arrowdown"||k==="s")setKey("down",false);
  if(k==="arrowleft"||k==="a")setKey("left",false);
  if(k==="arrowright"||k==="d")setKey("right",false);
}
document.addEventListener("keydown",keyDown);
document.addEventListener("keyup",keyUp);

document.querySelectorAll(".ctrl[data-key]").forEach(btn=>{
  const k=btn.dataset.key;
  btn.addEventListener("pointerdown",e=>{e.preventDefault();setKey(k,true);});
  btn.addEventListener("pointerup",e=>{e.preventDefault();setKey(k,false);});
  btn.addEventListener("pointercancel",()=>setKey(k,false));
  btn.addEventListener("pointerleave",()=>setKey(k,false));
});

document.getElementById("again").addEventListener("click",reset);

function update(){
 if(running){
   const speed=3.8;
   if(keys.left)bx-=speed;
   if(keys.right)bx+=speed;
   if(keys.up)by-=speed;
   if(keys.down)by+=speed;

   bx=clamp(bx,0,game.clientWidth-boy.offsetWidth);
   by=clamp(by,0,game.clientHeight-boy.offsetHeight);

   // Kat loopt weg van de jongen.
   let dx=(cx+35)-(bx+40),dy=(cy+35)-(by+40);
   let d=Math.hypot(dx,dy)||1;
   const catSpeed=1.8;
   cx+=dx/d*catSpeed;
   cy+=dy/d*catSpeed;

   cx=clamp(cx,0,game.clientWidth-cat.offsetWidth);
   cy=clamp(cy,0,game.clientHeight-cat.offsetHeight);

   if(d<58){
     running=false;
     score++;
     scoreEl.textContent=score;
     finalEl.textContent=score;
     message.style.display="flex";
   }
   draw();
 }
 requestAnimationFrame(update);
}

reset();
update();
})();
</script>
